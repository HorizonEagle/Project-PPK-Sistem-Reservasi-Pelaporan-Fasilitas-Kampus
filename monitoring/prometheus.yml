global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: campus-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ['backend:3001']
    # Backend (production) menolak /api/metrics tanpa METRICS_TOKEN. Nilai di bawah harus
    # sama dengan METRICS_TOKEN di docker-compose.yml; ganti keduanya di lingkungan nyata.
    authorization:
      type: Bearer
      credentials: dev-metrics-token-change-me

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
